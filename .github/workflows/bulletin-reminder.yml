name: Bulletin Sync & Zalo Reminder (11h / 15h VN)

on:
  schedule:
    # 11:00 VN (04:00 UTC) & 15:00 VN (08:00 UTC) hàng ngày
    - cron: '0 4,8 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Khung giờ gửi nhắc Zalo (11h / 15h / exact)'
        required: true
        default: '11h'
        type: choice
        options:
          - 11h
          - 15h
          - exact

concurrency:
  group: bulletin-reminder
  cancel-in-progress: false

jobs:
  dispatch-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements-etl.txt'

      - name: Cài đặt thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-etl.txt

      - name: Xác định khung giờ gửi nhắc & Đồng bộ + Gửi Zalo qua Eztech Consultant
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANCAKE_API_TOKEN: ${{ secrets.PANCAKE_API_TOKEN }}
          PANCAKE_API_TOKENS: ${{ secrets.PANCAKE_API_TOKENS }}
          PANCAKE_PAGES_JSON: ${{ secrets.PANCAKE_PAGES_JSON }}
          SKIP_ENSURE_SCHEMA: 'true'
        run: |
          python - << 'EOF'
          import os, json
          from datetime import datetime, timezone, timedelta
          from database.db import SessionLocal
          from etl.bulletin_sync import sync_bulletin_from_group
          from backend.bulletin_notifier import dispatch_daily_digest, dispatch_due_exact_reminders

          event_name = "${{ github.event_name }}"
          input_slot = "${{ github.event.inputs.slot }}"
          vn_now = datetime.now(timezone(timedelta(hours=7)))
          if event_name == "workflow_dispatch" and input_slot:
              slot = input_slot
          else:
              slot = "11h" if vn_now.hour < 13 else "15h"

          with SessionLocal() as db:
              sync_res = sync_bulletin_from_group(db=db, max_pages=3)
              print("SYNC:", json.dumps(sync_res, ensure_ascii=False))
              if slot == "exact":
                  ex_res = dispatch_due_exact_reminders(db=db, dry_run=False)
                  print("EXACT:", json.dumps(ex_res, ensure_ascii=False))
              else:
                  dig_res = dispatch_daily_digest(db=db, slot=slot, dry_run=False, force=False)
                  print("DIGEST:", json.dumps(dig_res, ensure_ascii=False))
                  ex_res = dispatch_due_exact_reminders(db=db, dry_run=False)
                  print("EXACT:", json.dumps(ex_res, ensure_ascii=False))
          EOF
