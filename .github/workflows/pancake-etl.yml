name: Pancake ETL Pipeline

on:
  schedule:
    # Chạy 5 lần mỗi ngày theo giờ Việt Nam:
    # 08:00 (01:00 UTC), 12:00 (05:00 UTC), 16:00 (09:00 UTC), 20:00 (13:00 UTC), 00:00 (17:00 UTC)
    - cron: '0 1,5,9,13,17 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên giao diện GitHub bất cứ lúc nào

concurrency:
  group: pancake-etl
  cancel-in-progress: false

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Chặn job treo ngốn quota (dữ liệu commit theo lô nên bị ngắt vẫn giữ phần đã ghi)
    
    steps:
    - name: Kiểm tra mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Python 3.10 & Kích hoạt Pip Cache
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: 'requirements-etl.txt'

    - name: Cài đặt thư viện Python (ETL Tối ưu)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-etl.txt

    - name: Chạy ETL Pipeline (Cào qua API nhanh)
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        PANCAKE_API_TOKEN: ${{ secrets.PANCAKE_API_TOKEN }}
        PANCAKE_API_TOKENS: ${{ secrets.PANCAKE_API_TOKENS }}
        PAGE_IDS: ${{ secrets.PAGE_IDS }}
        PANCAKE_PAGES_JSON: ${{ secrets.PANCAKE_PAGES_JSON }}
        DAILY_RUN_LIMIT: 200
        DAILY_DAYS_BACK: 1
      run: |
        python -m etl.pipeline
