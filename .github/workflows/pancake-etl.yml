name: Pancake ETL Pipeline

on:
  schedule:
    # Chạy mỗi 60 phút trong giờ làm việc (08:00 đến 18:00 giờ VN = 01:00 đến 11:00 UTC) để tiết kiệm 75% băng thông Neon:
    - cron: '0 1-11 * * *'
    # - Lúc 00:00 VN (17:00 UTC): chốt số liệu cuối ngày (thu thập tin nhắn ca tối)
    - cron: '0 17 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên giao diện GitHub bất cứ lúc nào
    inputs:
      days_back:
        description: 'Số ngày quét ngược về trước (Nhập 30 hoặc 60 nếu muốn cập nhật lịch sử tag cho các dòng cũ)'
        required: false
        default: '1'
      run_limit:
        description: 'Giới hạn số hội thoại mỗi page (Mặc định: 100, nhập 1000 nếu quét lịch sử)'
        required: false
        default: '100'
      enable_bot:
        description: 'Bật Bot tự động gửi tin nhắn phản hồi? (true/false)'
        required: false
        default: 'true'

concurrency:
  group: pancake-etl
  cancel-in-progress: false

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # Giới hạn tối đa 25 phút đủ cho cào 7 page và xử lý bot
    
    steps:
    - name: Kiểm tra mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Python 3.10 & Kích hoạt Pip Cache
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: 'requirements-etl.txt'

    - name: Cài đặt thư viện Python (ETL Tối ưu)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-etl.txt

    - name: Chạy ETL Pipeline (Cào qua API nhanh)
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        PANCAKE_API_TOKEN: ${{ secrets.PANCAKE_API_TOKEN }}
        PANCAKE_API_TOKENS: ${{ secrets.PANCAKE_API_TOKENS }}
        PAGE_IDS: ${{ secrets.PAGE_IDS }}
        PANCAKE_PAGES_JSON: ${{ secrets.PANCAKE_PAGES_JSON }}
        DAILY_RUN_LIMIT: ${{ github.event.inputs.run_limit || '100' }}
        DAILY_DAYS_BACK: ${{ github.event.inputs.days_back || '1' }}
        ENABLE_COMMENT_REPLY: ${{ github.event.inputs.enable_bot != 'false' }}
      run: |
        python -m etl.pipeline

    - name: Chạy Bot Tự Động Gửi Tin Nhắn (Auto-Reply Bot)
      if: ${{ github.event.inputs.enable_bot != 'false' }}
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        PANCAKE_API_TOKEN: ${{ secrets.PANCAKE_API_TOKEN }}
        PANCAKE_API_TOKENS: ${{ secrets.PANCAKE_API_TOKENS }}
        PAGE_IDS: ${{ secrets.PAGE_IDS }}
        PANCAKE_PAGES_JSON: ${{ secrets.PANCAKE_PAGES_JSON }}
        AUTO_REPLY_SEND: 'true'
      run: |
        python -m etl.auto_reply_bot --send --days 1 --limit 100

