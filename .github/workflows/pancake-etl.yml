name: Pancake ETL Pipeline (Playwright)

on:
  schedule:
    # Chạy mỗi ngày 1 lần vào lúc 0:00 sáng giờ VN (17:00 UTC)
    - cron: '0 17 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên giao diện GitHub # Cho phép bấm chạy thủ công trên giao diện GitHub

jobs:
  run-etl:
    runs-on: ubuntu-latest
    
    steps:
    - name: Kiểm tra mã nguồn
      uses: actions/checkout@v3

    - name: Cài đặt Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cài đặt thư viện Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt



    - name: Chạy ETL Pipeline (Cào qua API nhanh)
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        PANCAKE_API_TOKEN: ${{ secrets.PANCAKE_API_TOKEN }}
        PAGE_IDS: ${{ secrets.PAGE_IDS }}
      run: |
        python -m etl.pipeline

