name: Pancake ETL Pipeline (Playwright)

on:
  schedule:
    # Chạy mỗi giờ vào phút thứ 0 (0 * * * *)
    - cron: '0 * * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên giao diện GitHub

jobs:
  run-etl:
    runs-on: ubuntu-latest
    
    steps:
    - name: Kiểm tra mã nguồn
      uses: actions/checkout@v3

    - name: Cài đặt Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cài đặt thư viện Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Cài đặt trình duyệt Playwright
      run: |
        playwright install chromium
        playwright install-deps chromium

    - name: Chạy ETL Pipeline
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        PANCAKE_EMAIL: ${{ secrets.PANCAKE_EMAIL }}
        PANCAKE_PASSWORD: ${{ secrets.PANCAKE_PASSWORD }}
        PAGE_IDS: ${{ secrets.PAGE_IDS }}
      run: |
        python -m etl.pipeline
