services:
  # 1. FastAPI Backend Service
  - type: web
    name: pancake-lead-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Nhập Neon Database URL của bạn vào Render Dashboard

  # Đã chuyển ETL sang GitHub Actions

  # 3. Streamlit Dashboard (Cũ - Đã được thay thế bằng React)
  # - type: web
  #   name: pancake-dashboard
  #   env: python
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: streamlit run frontend/dashboard.py --server.port $PORT --server.address 0.0.0.0

  # 3. React Frontend (Mới)
  - type: web
    name: pancake-react-dashboard
    env: static
    buildCommand: cd frontend-react && npm install && npm run build
    staticPublishPath: frontend-react/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pancake-lead-api
          envVarKey: RENDER_EXTERNAL_URL
        # Gắn thêm /api vào sau URL (Sửa lại thủ công trên Render thành https://<api-url>/api)
